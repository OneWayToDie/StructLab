name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Release x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore StructLab.sln

      # Тесты (xUnit, этап 5.2) будут добавлены отдельным шагом:
      # - name: Run tests
      #   run: dotnet test StructLab.Tests/StructLab.Tests.csproj -c Release

      - name: Build
        run: msbuild StructLab.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal /nologo
